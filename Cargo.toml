[workspace]
resolver = "2"
members = [
    "mine_providers",
    "mine_agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Paddy Horan"]
license = "Apache-2.0"
repository = "https://github.com/paddyhoran/mine"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
