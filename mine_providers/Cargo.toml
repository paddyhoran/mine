[package]
name = "mine_providers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

async-trait = "0.1"
schemars = "1.2.1"
jsonschema = "0.46.0"
once_cell = "1.20"

reqwest = { version = "0.13.2", features = ["json", "stream"], optional = true }

candle-core = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
hf-hub = { version = "0.5.0", optional = true, features = ["tokio"] }
tokenizers = { version = "0.23.1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"]}
anyhow = { version = "1.0", optional = true }

aws-config = { version = "1.5", optional = true }
aws-sdk-bedrockruntime = { version = "1.59", optional = true }
bytes = { version = "1.8", optional = true }

[features]
default = ["http-client"]
http-client = ["reqwest"]
local-candle = ["candle-core", "candle-transformers", "hf-hub", "tokenizers", "anyhow"]
aws-bedrock = ["aws-config", "aws-sdk-bedrockruntime", "bytes"]
